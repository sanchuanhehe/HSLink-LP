[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hslink-lp"
version = "0.1.0.dev0"
description = "HSLink-LP host tooling scaffold"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hslink-lp = "hslink_lp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
